# Local PostgreSQL for development and tests. App runs on the host with `npm run dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aipos
      POSTGRES_PASSWORD: aipos
      POSTGRES_DB: aipos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
